[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gstack-agent"
version = "0.1.0"
description = "把 YC CEO 的思考方法变成你的 AI 助手"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "gstack-agent"}]
dependencies = ["requests>=2.28"]

[project.scripts]
gstack-agent = "gstack_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]